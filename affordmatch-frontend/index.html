<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AffordMatch</title>
<link rel="stylesheet" href="shared/styles.css">
<style>
  .landing{max-width:640px;margin:80px auto;text-align:center;}
  .landing .name{font-family:var(--font-serif);font-size:40px;margin-bottom:8px;}
  .landing .name b{font-style:italic;font-weight:normal;color:var(--signal);}
  .landing p{color:var(--ink-soft);margin-bottom:36px;}
  .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .apps a{display:block;background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;padding:24px 16px;text-decoration:none;color:var(--ink);}
  .apps a:hover{border-color:var(--line-strong);}
  .apps .t{font-weight:600;font-size:14.5px;margin-bottom:4px;}
  .apps .s{font-size:12.5px;color:var(--ink-faint);}
  @media(max-width:600px){.apps{grid-template-columns:1fr;}}
</style>
</head>
<body>
  <div class="shell landing">
    <div class="name">Afford<b>Match</b></div>
    <p>Affordability → matching → provider → deal.</p>
    <div class="apps">
      <a href="buyer/index.html"><div class="t">Buyer app</div><div class="s">Affordability calculator + matches</div></a>
      <a href="provider/index.html"><div class="t">Provider portal</div><div class="s">Qualified lead dashboard</div></a>
      <a href="admin/index.html"><div class="t">Admin console</div><div class="s">Platform overview</div></a>
    </div>
  </div>
</body>
</html>
